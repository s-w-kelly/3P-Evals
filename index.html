<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3P Eval Monitor</title>
    <meta property="og:title" content="3P Eval Monitor" />
    <meta property="og:description" content="Monitoring frontier AI labs' engagement of third-parties for pre-deployment safety evaluations" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://3pevalmonitor.skellydotcom.com/" />
    <link rel="icon" type="image/png" href="/3pfavnew.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var saved = localStorage.getItem('darkMode');
        var dark = saved !== null ? saved === 'true' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
